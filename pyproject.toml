[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zapfault"
dynamic = ["version"]
description = "Error tracking for Python apps, sent to Zapfault"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[tool.hatch.version]
path = "src/zapfault/_version.py"
